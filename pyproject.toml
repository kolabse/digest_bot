[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-digest-bot"
version = "0.1.0"
description = "Scheduled delivery of project digests from GitHub to Telegram"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.28,<0.29",
  "python-telegram-bot[job-queue,socks]>=22.8,<23",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
digest-bot = "digest_bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/digest_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
